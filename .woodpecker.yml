steps:
  - name: notify-start
    image: wener/woodpecker-feishu-bot
    settings:
      feishu_bot_url:
        from_secret: feishu_bot_url
      feishu_bot_secret:
        from_secret: feishu_bot_secret
      markdown: |
        🏗️ 开始构建 <%= env.CI_REPO_NAME %> #<%= env.CI_PIPELINE_NUMBER %>
        
        - 提交: <%= env.CI_COMMIT_SHA %> (<%= env.CI_COMMIT_BRANCH || env.CI_COMMIT_TAG %>)
        - 提交信息: <%= env.CI_COMMIT_MESSAGE.replaceAll(/\n/g, '; ') %>
        - 事件: <%= env.CI_PIPELINE_EVENT %>
        
        📦️ [查看构建详情](<%= env.CI_PIPELINE_URL %>)
    when:
      - event: [push, pull_request]
    failure: ignore

  - name: maven-build
    image: maven:3.9.12-eclipse-temurin-25-noble
    commands:
      - mvn clean deploy -Dmaven.test.skip=true -B
    when:
      - event: [push, pull_request]

  - name: notify-complete
    image: wener/woodpecker-feishu-bot
    settings:
      feishu_bot_url:
        from_secret: feishu_bot_url
      feishu_bot_secret:
        from_secret: feishu_bot_secret
      markdown: |
        <%= env.CI_PIPELINE_STATUS === 'success' ? '✅' : '❌' %> 构建完成 <%= env.CI_REPO_NAME %> #<%= env.CI_PIPELINE_NUMBER %>
        
        - 状态: <%= env.CI_PIPELINE_STATUS === 'success' ? '成功' : '失败' %>
        - 提交: <%= env.CI_COMMIT_SHA %> (<%= env.CI_COMMIT_BRANCH || env.CI_COMMIT_TAG %>)
        - 提交信息: <%= env.CI_COMMIT_MESSAGE.replaceAll(/\n/g, '; ') %>
        - 事件: <%= env.CI_PIPELINE_EVENT %>
        
        📦️ [查看构建详情](<%= env.CI_PIPELINE_URL %>)
    when:
      - status: [success, failure]
    failure: ignore